name: Database Backup (Cloudflare R2 / S3 Zero-Cost)

# Runs every night at 02:00 UTC.
# Dumps the Postgres database, compresses it, and streams to Cloudflare R2 (or AWS S3).
# Cloudflare R2 provides 10 GB free storage with $0 egress fees.

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:      # also triggerable manually from the Actions tab

jobs:
  backup:
    name: "Postgres → Cloudflare R2 / S3 Backup"
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Dump, Compress, and Upload to R2 / S3
        env:
          DB_NAME:          ${{ secrets.DB_NAME }}
          DB_USER:          ${{ secrets.DB_USER }}
          DB_PASSWORD:      ${{ secrets.DB_PASSWORD }}
          DB_HOST:          ${{ secrets.DB_HOST }}
          DB_PORT:          ${{ secrets.DB_PORT || '5432' }}
          R2_BUCKET:        ${{ secrets.BACKUP_BUCKET || 'pyloom-backups' }}
          R2_ENDPOINT_URL:  ${{ secrets.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          FILENAME="pyloom-backup-${TIMESTAMP}.sql.gz"
          TMPFILE="/tmp/${FILENAME}"

          echo "📦 Dumping database ${DB_NAME} from ${DB_HOST}…"
          PGPASSWORD="$DB_PASSWORD" pg_dump \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --username="$DB_USER" \
            --dbname="$DB_NAME" \
            --format=plain \
            --no-password \
          | gzip > "$TMPFILE"

          SIZE=$(du -sh "$TMPFILE" | cut -f1)
          echo "  Compressed backup size: $SIZE"

          ENDPOINT_FLAG=""
          if [ -n "${R2_ENDPOINT_URL:-}" ]; then
            ENDPOINT_FLAG="--endpoint-url ${R2_ENDPOINT_URL}"
            echo "☁️  Streaming to Cloudflare R2: s3://${R2_BUCKET}/backups/${FILENAME}…"
          else
            echo "☁️  Streaming to S3: s3://${R2_BUCKET}/backups/${FILENAME}…"
          fi

          aws s3 cp "$TMPFILE" "s3://${R2_BUCKET}/backups/${FILENAME}" ${ENDPOINT_FLAG}

          rm -f "$TMPFILE"
          echo "✅ Backup complete: ${FILENAME} (${SIZE})"

      - name: Log backup to summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Database Backup Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- Storage: Cloudflare R2 / S3 (Zero Egress Cost)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Target Bucket: \`${{ secrets.BACKUP_BUCKET || 'pyloom-backups' }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Timestamp: \`$(date -u)\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Database Backup Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Check workflow logs for connection or credentials issues." >> "$GITHUB_STEP_SUMMARY"
          fi
