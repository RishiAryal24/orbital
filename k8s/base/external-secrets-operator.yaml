# ==============================================================================
# PyLoom Technologies — External Secrets Operator (Zero-Trust Secrets Sync)
# Allows clients to sync secrets directly from their own Vault/Cloud without
# PyLoom engineers ever seeing or storing plaintext credentials.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: pyloom-vault-backend
spec:
  provider:
    # ── Example 1: HashiCorp Vault (Multi-Tenant AppRole) ─────────────────
    vault:
      server: "https://vault.pyloomtech.com"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "tenant-client-role-id"
          secretRef:
            name: vault-approle-secret
            key: secret-id
            namespace: kube-system
---
# ── Per-Tenant Secret Mapping Example ─────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: client-runtime-secrets
  namespace: orbital
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: pyloom-vault-backend
    kind: ClusterSecretStore
  target:
    name: orbital-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: pyloom/production/database
        property: password
    - secretKey: SECRET_KEY
      remoteRef:
        key: pyloom/production/django
        property: secret_key
    - secretKey: STRIPE_API_KEY
      remoteRef:
        key: pyloom/production/billing
        property: api_key
